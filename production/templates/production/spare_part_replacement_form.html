{% extends 'production/base.html' %}

{% block title %}备件更换 - {{ equipment.equipment_name }}{% endblock %}

{% block content %}
<h2 class="page-title">🔄 备件更换登记 - {{ equipment.equipment_name }}</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-row">
            <div class="form-group">
                <label>更换单号</label>
                <input type="text" name="replacement_code" value="{{ default_code }}" placeholder="系统自动生成">
            </div>
            <div class="form-group">
                <label>更换日期 *</label>
                <input type="date" name="replacement_date" value="{% now 'Y-m-d' %}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>更换备件 *</label>
                <select name="spare_part" required>
                    <option value="">请选择备件</option>
                    {% for p in parts %}
                    <option value="{{ p.pk }}" data-stock="{{ p.current_stock }}" data-price="{{ p.unit_price }}">
                        {{ p.part_name }} ({{ p.specification|default:"-" }}) - 库存: {{ p.current_stock }} {{ p.unit }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>数量 *</label>
                <input type="number" step="0.01" name="quantity" value="1" min="0.01" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>单价(元)</label>
                <input type="number" step="0.01" name="unit_price" id="unitPriceInput" value="0">
            </div>
            <div class="form-group">
                <label>操作人</label>
                <input type="text" name="operator" placeholder="请输入操作人姓名">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>关联保养记录</label>
                <select name="maintenance_record">
                    <option value="">无</option>
                    {% for mr in maintenance_records %}
                    <option value="{{ mr.pk }}">{{ mr.record_code }} - {{ mr.start_time|date:"Y-m-d" }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>关联维修记录</label>
                <select name="repair_record">
                    <option value="">无</option>
                    {% for rr in repair_records %}
                    <option value="{{ rr.pk }}">{{ rr.repair_code }} - {{ rr.apply_date }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label>更换原因</label>
            <textarea name="reason" rows="3" placeholder="请描述更换原因"></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>旧件状态</label>
                <input type="text" name="old_part_status" placeholder="如：损坏、磨损、老化等">
            </div>
            <div class="form-group">
                <label>旧件处理方式</label>
                <input type="text" name="old_part_disposal" placeholder="如：报废、维修、回收等">
            </div>
        </div>
        
        <div class="form-group">
            <label>备注</label>
            <textarea name="remarks" rows="3" placeholder="请输入备注信息"></textarea>
        </div>
        
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">提交更换记录</button>
            <a href="{% url 'production:equipment_detail' equipment.pk %}" class="btn btn-warning">取消</a>
        </div>
    </form>
</div>

<script>
document.querySelector('select[name="spare_part"]').addEventListener('change', function() {
    const selected = this.options[this.selectedIndex];
    const price = selected.getAttribute('data-price');
    if (price) {
        document.getElementById('unitPriceInput').value = price;
    }
});
</script>
{% endblock %}
