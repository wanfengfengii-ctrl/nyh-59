{% extends 'production/base.html' %}

{% block title %}添加能耗记录 - {{ batch.batch_no }}{% endblock %}

{% block content %}
<h2 class="page-title">⚡ 添加能耗记录 - {{ batch.batch_no }}</h2>

<div class="card">
    <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 6px;">
        <p><strong>批次信息：</strong></p>
        <p>原料来源：{{ batch.material_source }} | 原料重量：{{ batch.material_weight }}kg</p>
    </div>

    <form method="post" action="{% url 'production:energy_cost_create' batch.pk %}">
        {% csrf_token %}

        <div class="form-row">
            <div class="form-group">
                <label>工序阶段 *</label>
                <select name="stage_type" required>
                    <option value="">请选择工序阶段</option>
                    {% for value, label in stage_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>能源类型 *</label>
                <select name="energy_type" required>
                    <option value="">请选择能源类型</option>
                    {% for value, label in energy_type_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>消耗量 *</label>
                <input type="number" name="consumption" step="0.01" required placeholder="请输入消耗量">
            </div>
            <div class="form-group">
                <label>计量单位 *</label>
                <input type="text" name="unit" required placeholder="如：kWh、吨、m³">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>单价(元)</label>
                <input type="number" name="unit_price" step="0.01" value="0" placeholder="请输入单价">
            </div>
            <div class="form-group">
                <label>记录日期</label>
                <input type="date" name="record_date">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>表读数</label>
                <input type="text" name="meter_reading" placeholder="可选，填写仪表读数">
            </div>
            <div class="form-group">
                <label>记录人员 *</label>
                <input type="text" name="operator" required placeholder="请输入记录人员姓名">
            </div>
        </div>

        <div class="form-group">
            <label>备注</label>
            <textarea name="remark" rows="3" placeholder="请输入备注信息"></textarea>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">保存能耗记录</button>
            <a href="{% url 'production:batch_cost_detail' batch.pk %}" class="btn btn-warning">取消</a>
        </div>
    </form>
</div>
{% endblock %}
