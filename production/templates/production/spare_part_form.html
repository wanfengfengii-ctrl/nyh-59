{% extends 'production/base.html' %}

{% block title %}{% if part %}编辑备件{% else %}新增备件{% endif %} - 设备维护与运行管理{% endblock %}

{% block content %}
<h2 class="page-title">{% if part %}📝 编辑备件{% else %}➕ 新增备件{% endif %}</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        
        <div class="form-row">
            <div class="form-group">
                <label>备件编号 *</label>
                <input type="text" name="part_code" value="{% if part %}{{ part.part_code }}{% endif %}" required placeholder="请输入备件编号">
            </div>
            <div class="form-group">
                <label>备件名称 *</label>
                <input type="text" name="part_name" value="{% if part %}{{ part.part_name }}{% endif %}" required placeholder="请输入备件名称">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>备件类型 *</label>
                <select name="part_type" required>
                    {% for value, label in SPARE_PART_TYPE_CHOICES %}
                    <option value="{{ value }}" {% if part and part.part_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>规格型号</label>
                <input type="text" name="specification" value="{% if part %}{{ part.specification }}{% endif %}" placeholder="请输入规格型号">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>计量单位</label>
                <input type="text" name="unit" value="{% if part %}{{ part.unit }}{% else %}个{% endif %}" placeholder="如：个、件、套等">
            </div>
            <div class="form-group">
                <label>单价(元) *</label>
                <input type="number" step="0.01" name="unit_price" value="{% if part %}{{ part.unit_price }}{% else %}0{% endif %}" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>当前库存</label>
                <input type="number" step="0.01" name="current_stock" value="{% if part %}{{ part.current_stock }}{% else %}0{% endif %}">
            </div>
            <div class="form-group">
                <label>安全库存</label>
                <input type="number" step="0.01" name="safety_stock" value="{% if part %}{{ part.safety_stock }}{% else %}0{% endif %}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>最高库存</label>
                <input type="number" step="0.01" name="max_stock" value="{% if part %}{{ part.max_stock }}{% else %}0{% endif %}">
            </div>
            <div class="form-group">
                <label>存放位置</label>
                <input type="text" name="location" value="{% if part %}{{ part.location }}{% endif %}" placeholder="请输入存放位置">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>供应商</label>
                <input type="text" name="supplier" value="{% if part %}{{ part.supplier }}{% endif %}" placeholder="请输入供应商">
            </div>
            <div class="form-group">
                <label>生产厂家</label>
                <input type="text" name="manufacturer" value="{% if part %}{{ part.manufacturer }}{% endif %}" placeholder="请输入生产厂家">
            </div>
        </div>
        
        <div class="form-group">
            <label>适用设备</label>
            <select name="applicable_equipment" multiple size="6">
                {% for eq in equipments %}
                <option value="{{ eq.pk }}" {% if part and eq in part.applicable_equipment.all %}selected{% endif %}>
                    {{ eq.equipment_code }} - {{ eq.equipment_name }}
                </option>
                {% endfor %}
            </select>
            <small style="color: #999;">按住Ctrl可多选</small>
        </div>
        
        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" name="is_active" {% if not part or part.is_active %}checked{% endif %}>
                <span>是否启用</span>
            </label>
        </div>
        
        <div class="form-group">
            <label>备注</label>
            <textarea name="remarks" rows="3" placeholder="请输入备注信息">{% if part %}{{ part.remarks }}{% endif %}</textarea>
        </div>
        
        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">
                {% if part %}保存修改{% else %}创建备件{% endif %}
            </button>
            {% if part %}
            <a href="{% url 'production:spare_part_detail' part.pk %}" class="btn btn-warning">取消</a>
            {% else %}
            <a href="{% url 'production:spare_part_list' %}" class="btn btn-warning">取消</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
